# Image tags are pinned to app versions on purpose (updated 2026-08-16).
# `:latest` on lscr.io/linuxserver/* would happily cross a major boundary —
# e.g. Sonarr v4 → v5 — and a major bump breaks the wiring between services
# (Prowlarr app-sync, Seerr's *arr connectors, Bazarr's provider APIs) while
# every container still reports "healthy". Pinning the app version still picks
# up base-image rebuilds of that version. To upgrade: bump the tag here, then
# `docker compose pull && docker compose up -d` — never the other way round.
#
# Ports: only Jellyfin and Seerr (both behind their own login) listen on every
# address of the LXC, so they stay reachable from the VPN as well as the LAN.
# Everything else is bound to 127.0.0.1: the LXC's eth0 sits on the LXD bridge,
# which every other container and every VPN peer can reach, and the *arr apps
# and qBittorrent can be set to skip their login for "local" (private)
# addresses. The LXD proxy devices and ./grab connect to 127.0.0.1, and the
# services reach each other by name on media-net.
x-hardening: &hardening
  # No privilege gain through setuid binaries inside the containers;
  # linuxserver's s6 drops to PUID/PGID with setuid(), which this does not block.
  security_opt:
    - no-new-privileges:true

services:

  # ============================================================
  # JELLYFIN — Media Server
  # Access: http://<server-ip>:8096
  # NOTE: Runs WITHOUT GPU on purpose. The host GPU (RTX 5070 Ti, 16 GB) is
  # reserved for the `llm` LXC container (llama-server uses ~14.4/16 GB VRAM).
  # The LG 4K TV direct-plays H.264/HEVC, so HW transcoding is rarely needed;
  # any transcode falls back to CPU. See docs/runbook.md (2026-06-21 incident).
  # ============================================================
  jellyfin:
    <<: *hardening
    image: jellyfin/jellyfin:10.11.11
    container_name: jellyfin
    environment:
      - JELLYFIN_PublishedServerUrl=http://192.168.1.216:8096
    volumes:
      - ${CONFIG_PATH}/jellyfin:/config
      - ${CONFIG_PATH}/jellyfin/cache:/cache
      - ${DATA_PATH}/media:/data/media:ro  # read-only: Jellyfin only reads media
    ports:
      - "8096:8096"
    restart: unless-stopped
    networks:
      - media-net

  # ============================================================
  # QBITTORRENT — Torrent Client
  # Access: http://<server-ip>:8085
  # Default login: admin / (check logs: docker logs qbittorrent)
  # ============================================================
  qbittorrent:
    <<: *hardening
    image: lscr.io/linuxserver/qbittorrent:5.2.3
    container_name: qbittorrent
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8085
    volumes:
      - ${CONFIG_PATH}/qbittorrent:/config
      - ${DATA_PATH}:/data  # Full /data access for downloads
    ports:
      - "127.0.0.1:8085:8085"
      - "127.0.0.1:6881:6881"
      - "127.0.0.1:6881:6881/udp"
    restart: unless-stopped
    networks:
      - media-net

  # ============================================================
  # PROWLARR — Indexer Manager (toloka.to, 1337x, RuTracker, etc.)
  # Access: http://<server-ip>:9696
  # ============================================================
  prowlarr:
    <<: *hardening
    image: lscr.io/linuxserver/prowlarr:2.5.2
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_PATH}/prowlarr:/config
    ports:
      - "127.0.0.1:9696:9696"
    restart: unless-stopped
    networks:
      - media-net

  # ============================================================
  # RADARR — Movie Automation
  # Access: http://<server-ip>:7878
  # ============================================================
  radarr:
    <<: *hardening
    image: lscr.io/linuxserver/radarr:6.3.0
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_PATH}/radarr:/config
      - ${DATA_PATH}:/data  # Same /data mount — enables hardlinks
    ports:
      - "127.0.0.1:7878:7878"
    restart: unless-stopped
    networks:
      - media-net

  # ============================================================
  # SONARR — TV Show Automation
  # Access: http://<server-ip>:8989
  # ============================================================
  sonarr:
    <<: *hardening
    image: lscr.io/linuxserver/sonarr:4.0.19
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_PATH}/sonarr:/config
      - ${DATA_PATH}:/data  # Same /data mount — enables hardlinks
    ports:
      - "127.0.0.1:8989:8989"
    restart: unless-stopped
    networks:
      - media-net

  # ============================================================
  # BAZARR — Subtitle Automation (Ukrainian + English)
  # Access: http://<server-ip>:6767
  # ============================================================
  bazarr:
    <<: *hardening
    image: lscr.io/linuxserver/bazarr:1.6.0
    container_name: bazarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_PATH}/bazarr:/config
      - ${DATA_PATH}/media:/data/media  # Needs access to media for subtitle matching
    ports:
      - "127.0.0.1:6767:6767"
    restart: unless-stopped
    networks:
      - media-net

  # ============================================================
  # SEERR — Request & Browse UI (successor to Jellyseerr)
  # Access: http://<server-ip>:5055
  # ============================================================
  jellyseerr:
    <<: *hardening
    image: ghcr.io/seerr-team/seerr:v3.4.1
    container_name: jellyseerr
    environment:
      - TZ=${TZ}
    volumes:
      - ${CONFIG_PATH}/jellyseerr:/app/config
    ports:
      - "5055:5055"
    restart: unless-stopped
    networks:
      - media-net

networks:
  media-net:
    driver: bridge
